module:
  slug: b1-grammatik-1
  level: B1
  position: 2
  icon: grammar
  title_de: Grammatik B1 – Teil 1
  title_ar: قواعد B1 — الجزء الأول
  description_ar: الجمل الموصولة، المبني للمجهول، الـ Plusquamperfekt مع als/nachdem، الـ Präteritum للأفعال الكاملة، المصدر مع zu و um…zu و damit.

lessons:
  - slug: b1-g-relativ
    title_de: Relativsätze
    title_ar: الجمل الموصولة (Relativsätze)
    goal_ar: أن تصف شخصاً أو شيئاً بجملة موصولة (الذي/التي) بالحالة الصحيحة.
    explanation_ar: |
      ## ضمير الوصل = الأداة تقريباً (ما عدا Dativ الجمع)
      | | مذكر | مؤنث | محايد | جمع |
      |---|---|---|---|---|
      | Nom. | der | die | das | die |
      | Akk. | den | die | das | die |
      | Dat. | dem | der | dem | **denen** |
      ## القاعدة
      - **الجنس والعدد** من الاسم الذي نصفه.
      - **الحالة** من دوره في الجملة الموصولة.
      - **الفعل في الآخر**.
      > Das ist der Mann, **der** neben mir wohnt. (فاعل → Nom.)
      > Das ist der Mann, **den** ich gestern gesehen habe. (مفعول → Akk.)
      > Das ist der Mann, **dem** ich geholfen habe. (helfen + Dat.)
      > Das ist die Firma, **bei der** ich arbeite. (مع حرف جر)
      ## wo / was
      > Berlin ist die Stadt, **wo** ich wohne. — Das ist alles, **was** ich weiß.
    items:
      - {rule: "**الجنس** من الاسم، **الحالة** من الجملة الموصولة، **الفعل في الآخر**.", de: "Der Film, den wir gesehen haben, war super.\nDie Kollegin, mit der ich arbeite, ist nett."}
      - gap: "Das ist die Frau, ___ in der Bäckerei arbeitet."
        options: [die, der, den]
      - gap: "Der Pullover, ___ ich gekauft habe, ist zu klein."
        options: [den, der, dem]
      - gap: "Das ist das Kind, ___ ich bei den Hausaufgaben helfe."
        options: [dem, das, den]
      - gap: "Die Leute, ___ ich gestern kennengelernt habe, sind sehr nett."
        options: [die, denen, der]
      - gap: "Die Freunde, mit ___ ich in Urlaub fahre, kommen aus Bonn."
        options: [denen, die, den]
      - gap: "Das ist der Kollege, ___ Auto kaputt ist."
        options: [dessen, der, dem]
      - gap: "Das ist alles, ___ ich weiß."
        options: [was, das, wo]
      - gap: "Hamburg ist die Stadt, ___ ich geboren bin."
        options: [wo, was, die]
      - quiz: "أي جملة صحيحة؟"
        options: ["Das ist die Firma, bei der ich arbeite.", "Das ist die Firma, die ich bei arbeite.", "Das ist die Firma, bei die ich arbeite.", "Das ist die Firma, bei der arbeite ich."]
      - order: "Der Mann, der dort steht, ist mein Chef."
        ar: الرجل الذي يقف هناك هو مديري.
      - write: "die ich liebe"
        ar: "أكمل: Das ist die Stadt, … (التي أحبها)"

  - slug: b1-g-passiv
    title_de: Das Passiv
    title_ar: المبني للمجهول (Passiv)
    goal_ar: أن تستخدم المبني للمجهول عندما يكون الفعل أهم من الفاعل — في الأخبار والتعليمات والعمليات.
    explanation_ar: |
      ## Passiv = werden + Partizip II
      | الزمن | مثال |
      |---|---|
      | Präsens | Das Haus **wird** gebaut. |
      | Präteritum | Das Haus **wurde** 1990 gebaut. |
      | Perfekt | Das Haus **ist** gebaut **worden**. |
      | مع فعل ناقص | Das Haus **muss** renoviert **werden**. |
      ## الفاعل (إذا ذكرناه): von + Dativ
      > Die Brücke wurde **von** einer Firma aus Köln gebaut.
      ## Aktiv → Passiv
      > Der Mechaniker repariert das Auto. → Das Auto **wird** (vom Mechaniker) **repariert**.
      ## werden: ich werde, du wirst, er wird, wir werden — wurde, wurdest, wurde, wurden
    items:
      - {rule: "**Passiv = werden + Partizip II** — المفعول به يصبح فاعلاً.", de: "Hier wird Deutsch gesprochen.\nDas Paket wurde gestern geliefert."}
      - gap: "In Österreich ___ Deutsch gesprochen."
        options: [wird, werden, wurde]
      - gap: "Die Briefe ___ jeden Morgen gebracht."
        options: [werden, wird, wurden gebracht]
      - gap: "Das Rathaus ___ im Jahr 1850 gebaut."
        options: [wurde, wird, worden]
      - gap: "Mein Fahrrad ist gestohlen ___."
        options: [worden, geworden, werden]
      - gap: "Die Wohnung muss renoviert ___."
        options: [werden, worden, wird]
      - gap: "Das Buch wurde ___ einem jungen Autor geschrieben."
        options: [von, durch das, mit]
      - quiz: "حوّل: 'Man öffnet die Tür um 8 Uhr.'"
        options: ["Die Tür wird um 8 Uhr geöffnet.", "Die Tür wurde um 8 Uhr öffnet.", "Die Tür ist um 8 Uhr geöffnet werden.", "Die Tür werden um 8 Uhr geöffnet."]
      - order: "Das Auto wird gerade repariert."
        ar: السيارة تُصلَح الآن.
      - order: "Die Kinder wurden vom Arzt untersucht."
        ar: فُحص الأطفال من قبل الطبيب.
      - write: "Das Essen wird gekocht.|Das Essen wird gekocht"
        ar: "اكتب بالمجهول: الطعام يُطبخ."

  - slug: b1-g-praeteritum
    title_de: Präteritum – Erzählen in der Vergangenheit
    title_ar: الماضي البسيط (Präteritum) — السرد
    goal_ar: أن تفهم وتستخدم الـ Präteritum في القصص والنصوص المكتوبة والأخبار.
    explanation_ar: |
      ## متى؟
      في **الكتابة** (قصص، أخبار، سِيَر). في الكلام نستعمل غالباً Perfekt.
      ## الأفعال المنتظمة: الجذع + te
      | ich/er | du | wir/sie | ihr |
      |---|---|---|---|
      | mach**te** | mach**test** | mach**ten** | mach**tet** |
      ## غير المنتظمة: تغيير حرف العلة، ولا نهاية مع ich/er
      | المصدر | Präteritum | المصدر | Präteritum |
      |---|---|---|---|
      | gehen | ging | kommen | kam |
      | sehen | sah | geben | gab |
      | fahren | fuhr | finden | fand |
      | sprechen | sprach | schreiben | schrieb |
      | nehmen | nahm | bleiben | blieb |
      | wissen | wusste | denken | dachte |
      | stehen | stand | liegen | lag |
      > Es **war** einmal ein König. Er **hatte** drei Töchter… (كان يا ما كان)
    items:
      - gap: "Gestern ___ ich meinen alten Lehrer in der Stadt. (sehen)"
        options: [sah, sehte, sieht]
      - gap: "Wir ___ um 10 Uhr nach Hause. (gehen)"
        options: [gingen, gehten, gangen]
      - gap: "Er ___ den Brief und ___ zur Post. (schreiben, gehen)"
        options: ["schrieb … ging", "schreibte … gehte", "schrieb … gehte"]
      - gap: "Plötzlich ___ das Telefon. (klingeln)"
        options: [klingelte, klang, klingelt]
      - gap: "Sie ___ nicht, was sie sagen sollte. (wissen)"
        options: [wusste, wisste, weißte]
      - gap: "Damals ___ wir in einem kleinen Dorf. (wohnen)"
        options: [wohnten, wohnen, gewohnt]
      - match: ["kommen = kam", "fahren = fuhr", "finden = fand", "nehmen = nahm", "bleiben = blieb"]
        ar: طابق المصدر بالـ Präteritum
      - order: "Als Kind wohnte ich bei meinen Großeltern."
        ar: كطفل سكنت عند جدّي وجدّتي.
      - write: "er kam"
        ar: "اكتب Präteritum لـ 'er kommt':"

  - slug: b1-g-plusquamperfekt
    title_de: Plusquamperfekt, als, wenn, nachdem, bevor
    title_ar: الماضي الأسبق والجمل الزمنية
    goal_ar: أن ترتب الأحداث في الماضي باستخدام الـ Plusquamperfekt و als/wenn/nachdem/bevor/während.
    explanation_ar: |
      ## Plusquamperfekt = hatte/war + Partizip II
      حدث **قبل** حدث آخر في الماضي:
      > Nachdem ich gegessen **hatte**, **ging** ich spazieren.
      ## als أم wenn؟
      | als | wenn |
      |---|---|
      | مرة واحدة في الماضي | تكرار في الماضي، أو حاضر/مستقبل |
      | **Als** ich 10 war, … | **Wenn** ich Zeit hatte (كل مرة)… |
      ## روابط زمنية أخرى (الفعل في الآخر)
      bevor (قبل أن)، während (بينما)، seitdem (منذ أن)، bis (حتى)، sobald (بمجرد أن)
    items:
      - gap: "___ ich ein Kind war, wohnte ich in Aleppo."
        options: [Als, Wenn, Wann]
      - gap: "Immer ___ es regnete, blieben wir zu Hause."
        options: [wenn, als, wann]
      - gap: "Nachdem er die Prüfung bestanden ___, feierte er mit Freunden."
        options: [hatte, hat, war]
      - gap: "Nachdem wir angekommen ___, riefen wir die Eltern an."
        options: [waren, hatten, sind]
      - gap: "___ du gehst, mach bitte das Licht aus."
        options: [Bevor, Nachdem, Als]
      - gap: "___ ich koche, höre ich Musik."
        options: [Während, Bevor, Seit]
      - gap: "Warte hier, ___ ich zurückkomme."
        options: [bis, seit, als]
      - quiz: "أي جملة صحيحة؟"
        options: ["Als ich nach Deutschland kam, sprach ich kein Deutsch.", "Wenn ich nach Deutschland kam, sprach ich kein Deutsch.", "Als ich kam nach Deutschland, sprach ich kein Deutsch.", "Als ich nach Deutschland kam, ich sprach kein Deutsch."]
      - order: "Bevor ich zur Arbeit gehe, trinke ich einen Kaffee."
        ar: قبل أن أذهب إلى العمل أشرب قهوة.
      - write: "Als ich jung war|Als ich jung war,"
        ar: "اكتب: عندما كنت صغيراً (Als …)"

  - slug: b1-g-zu-infinitiv
    title_de: Infinitiv mit zu, um … zu, damit, ohne … zu
    title_ar: المصدر مع zu، و um…zu، و damit
    goal_ar: أن تستخدم Infinitiv mit zu بعد أفعال وتعابير معيّنة، وتعبّر عن الهدف بـ um…zu و damit.
    explanation_ar: |
      ## Infinitiv mit zu
      بعد أفعال مثل: versuchen, vergessen, anfangen, aufhören, vorhaben, hoffen, Lust haben, Zeit haben, es ist wichtig/schwer/schön
      > Ich **versuche**, jeden Tag Deutsch **zu** lernen.
      > Es ist schwer, eine Wohnung **zu** finden.
      مع الأفعال المنفصلة: zu في الوسط → an**zu**rufen, ein**zu**kaufen.
      ## um … zu = لكي (نفس الفاعل)
      > Ich lerne Deutsch, **um** in Deutschland **zu** studieren.
      ## damit = لكي (فاعل مختلف)
      > Ich spreche langsam, **damit** du mich **verstehst**.
      ## ohne … zu = دون أن
      > Er ging, **ohne** etwas **zu** sagen.
    items:
      - gap: "Ich habe vergessen, dich ___."
        options: [anzurufen, zu anrufen, anrufen]
      - gap: "Es ist wichtig, genug Wasser zu ___."
        options: [trinken, trinkt, getrunken]
      - gap: "Ich spare Geld, ___ ein Auto zu kaufen."
        options: [um, damit, ohne]
      - gap: "Ich erkläre es noch einmal, ___ alle es verstehen."
        options: [damit, um, dass zu]
      - gap: "Er hat das Zimmer verlassen, ___ Tschüss zu sagen."
        options: [ohne, um, damit]
      - gap: "Hast du Lust, heute Abend ins Kino ___?"
        options: [zu gehen, gehen, zu geht]
      - gap: "Ich fange an, mich für Politik ___."
        options: [zu interessieren, interessieren, interessieren zu]
      - quiz: "أي جملة صحيحة؟"
        options: ["Ich gehe zum Amt, um meinen Pass abzuholen.", "Ich gehe zum Amt, um meinen Pass zu abholen.", "Ich gehe zum Amt, damit meinen Pass abholen.", "Ich gehe zum Amt, um abzuholen meinen Pass."]
      - order: "Ich lerne Deutsch, um eine bessere Arbeit zu finden."
        ar: أتعلم الألمانية لكي أجد عملاً أفضل.
      - write: "einzukaufen"
        ar: "اكتب المصدر مع zu للفعل einkaufen:"

  - slug: b1-grammatik-1-test
    kind: test
    title_de: Modultest – Grammatik B1 Teil 1
    title_ar: اختبار قواعد B1 — الجزء الأول
    goal_ar: النجاح من 70٪.
    items:
      - gap: "Der Arzt, ___ ich gestern war, ist sehr gut."
        options: [bei dem, bei den, der]
      - gap: "Die Nachbarn, ___ ich die Blumen gieße, sind im Urlaub."
        options: [denen, die, deren]
      - gap: "Das Museum ___ letztes Jahr renoviert."
        options: [wurde, wird, worden]
      - gap: "Die Rechnung muss bis Freitag bezahlt ___."
        options: [werden, worden, wurde]
      - gap: "Damals ___ wir kein Auto. (haben)"
        options: [hatten, hätten, habten]
      - gap: "Er ___ lange auf den Bus. (warten)"
        options: [wartete, wartet, wart]
      - gap: "___ ich in Berlin ankam, regnete es."
        options: [Als, Wenn, Nachdem dass]
      - gap: "Nachdem sie gefrühstückt ___, ging sie zur Arbeit."
        options: [hatte, war, hat]
      - gap: "Es ist nicht leicht, neue Freunde ___."
        options: [zu finden, finden, zu findet]
      - gap: "Ich gebe dir meine Nummer, ___ du mich anrufen kannst."
        options: [damit, um, ohne]
      - order: "Das ist der Kollege, mit dem ich jeden Tag arbeite."
        ar: هذا الزميل الذي أعمل معه كل يوم.
      - order: "Die Fenster werden morgen geputzt."
        ar: النوافذ ستُنظّف غداً.
      - write: "Hier wird Deutsch gesprochen.|Hier wird Deutsch gesprochen"
        ar: "اكتب: هنا يُتكلم بالألمانية."
