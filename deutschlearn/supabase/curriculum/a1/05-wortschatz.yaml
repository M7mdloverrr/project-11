  icon: book
  title_de: Wortschatz A1 – Goethe-Wortliste
  title_ar: مفردات A1 — قائمة كلمات Goethe
  description_ar: بقية كلمات قائمة Goethe A1 مرتبة حسب المواضيع — الأفعال، الصفات، الكلمات الصغيرة المهمة، الدوائر والبنك والبريد، السفر، المدرسة والدراسة، البيت والطبيعة.

lessons:
  - slug: a1-w-verben
    title_de: Die wichtigsten Verben A1
    title_ar: أهم أفعال A1
    goal_ar: أن تعرف أهم 50 فعلاً في قائمة A1 وتستخدمها في جمل قصيرة.
    explanation_ar: |
      ## كيف تحفظ الأفعال؟
      احفظ المصدر + تصريف er، خاصة إذا كان غير منتظم:
      > geben – er gibt, nehmen – er nimmt, helfen – er hilft, sehen – er sieht
      الأفعال المنفصلة مكتوبة بخط عمودي في الشرح: an|rufen → Ich rufe an.
    items:
      - {vocab: "antworten", ar: "يجيب", ex: "Bitte antworten Sie schnell.", ex_ar: "أجب بسرعة من فضلك."}
      - {vocab: "fragen", ar: "يسأل", ex: "Darf ich etwas fragen?", ex_ar: "هل يمكنني أن أسأل شيئاً؟"}
      - {vocab: "sagen", ar: "يقول", ex: "Was sagst du?", ex_ar: "ماذا تقول؟"}
