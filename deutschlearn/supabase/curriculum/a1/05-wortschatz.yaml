  - slug: a1-w-adjektive
    title_de: Adjektive und Gegensätze
    title_ar: الصفات والأضداد
    goal_ar: أن تعرف صفات A1 الأساسية وأضدادها لتصف الأشياء والأشخاص.
    explanation_ar: |
      ## احفظ الصفات أزواجاً
      | gut ↔ schlecht | neu ↔ alt | jung ↔ alt |
      |---|---|---|
      | schnell ↔ langsam | lang ↔ kurz | schön ↔ hässlich |
      | leicht ↔ schwer | voll ↔ leer | richtig ↔ falsch |
      ## zu = أكثر من اللازم
      > Das ist **zu** teuer. (غالٍ جداً — لا أشتريه)
      > Das ist **sehr** schön. (جميل جداً — إيجابي)
    items:
      - {vocab: "gut ↔ schlecht", ar: "جيد ↔ سيئ", ex: "Das Essen ist gut.", ex_ar: "الطعام جيد."}
      - {vocab: "neu ↔ alt", ar: "جديد ↔ قديم"}
      - {vocab: "jung ↔ alt", ar: "شاب ↔ كبير في السن"}
      - {vocab: "schön ↔ hässlich", ar: "جميل ↔ قبيح"}
      - {vocab: "schnell ↔ langsam", ar: "سريع ↔ بطيء", ex: "Sprechen Sie bitte langsam.", ex_ar: "تكلم ببطء من فضلك."}
      - {vocab: "lang ↔ kurz", ar: "طويل ↔ قصير"}
      - {vocab: "leicht ↔ schwer", ar: "سهل/خفيف ↔ صعب/ثقيل", ex: "Deutsch ist nicht so schwer.", ex_ar: "الألمانية ليست صعبة جداً."}
      - {vocab: "voll ↔ leer", ar: "ممتلئ ↔ فارغ", ex: "Der Bus ist voll.", ex_ar: "الباص ممتلئ."}
      - {vocab: "richtig ↔ falsch", ar: "صحيح ↔ خطأ", ex: "Die Antwort ist richtig.", ex_ar: "الإجابة صحيحة."}
      - {vocab: "offen ↔ geschlossen", ar: "مفتوح ↔ مغلق"}
      - {vocab: "frei ↔ besetzt", ar: "حر/فارغ ↔ مشغول", ex: "Ist der Platz frei?", ex_ar: "هل المكان فارغ؟"}
      - {vocab: "laut ↔ leise", ar: "عالٍ ↔ هادئ (صوت)"}
      - {vocab: "ruhig", ar: "هادئ", ex: "Die Straße ist ruhig.", ex_ar: "الشارع هادئ."}
      - {vocab: "sauber ↔ schmutzig", ar: "نظيف ↔ متّسخ"}
      - {vocab: "kaputt", ar: "معطّل / مكسور", ex: "Die Heizung ist kaputt.", ex_ar: "التدفئة معطلة."}
      - {vocab: "müde", ar: "متعب", ex: "Ich bin sehr müde.", ex_ar: "أنا متعب جداً."}
      - {vocab: "glücklich ↔ traurig", ar: "سعيد ↔ حزين"}
      - {vocab: "nett / freundlich", ar: "لطيف / ودود", ex: "Die Nachbarn sind nett.", ex_ar: "الجيران لطفاء."}
      - {vocab: "wichtig", ar: "مهم", ex: "Das ist sehr wichtig.", ex_ar: "هذا مهم جداً."}
      - {vocab: "richtig / genau", ar: "بالضبط"}
      - {vocab: "fertig", ar: "جاهز / انتهى", ex: "Das Essen ist fertig.", ex_ar: "الطعام جاهز."}
      - {vocab: "allein", ar: "وحيد / لوحده", ex: "Ich wohne allein.", ex_ar: "أسكن لوحدي."}
      - {vocab: "zusammen", ar: "معاً", ex: "Wir lernen zusammen.", ex_ar: "نتعلم معاً."}
      - {vocab: "möglich", ar: "ممكن", ex: "Ist das möglich?", ex_ar: "هل هذا ممكن؟"}
      - {vocab: "privat", ar: "خاص / شخصي"}
      - {vocab: "bekannt", ar: "معروف"}
      - {vocab: "breit / schmal", ar: "عريض / ضيّق"}
      - {vocab: "hoch", ar: "عالٍ / مرتفع"}
      - {vocab: "tief", ar: "عميق"}
      - {vocab: "schön / prima / super / toll", ar: "رائع / ممتاز", ex: "Das ist toll!", ex_ar: "هذا رائع!"}
      - gap: "Der Bus ist ___. Es gibt keinen Platz."
        options: [voll, leer, frei]
      - gap: "Sprechen Sie bitte ___. Ich verstehe nicht."
        options: [langsam, schnell, laut]
      - gap: "Die Waschmaschine ist ___. Sie funktioniert nicht."
        options: [kaputt, sauber, fertig]
      - gap: "Das Kleid kostet 300 Euro. Das ist ___ teuer!"
        options: [zu, sehr gut, nicht]
      - quiz: "ما ضد 'richtig'؟"
        options: [falsch, schlecht, leer, langsam]
      - match: ["voll = leer", "laut = leise", "sauber = schmutzig", "jung = alt", "glücklich = traurig"]
        ar: طابق كل صفة بضدّها
      - order: "Ist der Platz hier frei?"
        ar: هل هذا المكان فارغ؟
      - write: "Ich bin müde.|Ich bin müde"
        ar: "اكتب: أنا متعب."

  - slug: a1-w-kleine-woerter
    title_de: Kleine Wörter – Adverbien, Mengen, Verbindungen
    title_ar: الكلمات الصغيرة المهمة — الظروف والكميات والروابط
    goal_ar: أن تستخدم الكلمات الصغيرة التي تتكرر في كل جملة — hier, dort, immer, oft, viel, alle, auch, noch…
    explanation_ar: |
      ## كم مرة؟ (الترتيب من الأكثر للأقل)
      | immer | oft | manchmal | selten | nie |
      |---|---|---|---|---|
      | دائماً | غالباً | أحياناً | نادراً | أبداً |
      ## المكان
      hier (هنا) – dort/da (هناك) – oben (فوق) – unten (تحت) – drinnen/draußen (داخل/خارج)
      ## الكمية
      viel (كثير) – wenig (قليل) – alle (الجميع) – etwas (شيء ما) – nichts (لا شيء)
      ## جزيئات مهمة
      > auch (أيضاً) — noch (ما زال / بعد) — schon (من قبل / بالفعل) — nur (فقط) — erst (فقط/لم… إلا) — wieder (مرة أخرى)
    items:
      - {vocab: "immer", ar: "دائماً", ex: "Er kommt immer zu spät.", ex_ar: "هو دائماً يتأخر."}
      - {vocab: "oft", ar: "غالباً", ex: "Ich gehe oft spazieren.", ex_ar: "أتمشى غالباً."}
      - {vocab: "manchmal", ar: "أحياناً"}
      - {vocab: "selten", ar: "نادراً"}
      - {vocab: "nie", ar: "أبداً", ex: "Ich trinke nie Alkohol.", ex_ar: "لا أشرب الكحول أبداً."}
      - {vocab: "jetzt", ar: "الآن", ex: "Ich habe jetzt Zeit.", ex_ar: "لدي وقت الآن."}
      - {vocab: "bald", ar: "قريباً", ex: "Bis bald!", ex_ar: "إلى اللقاء قريباً!"}
      - {vocab: "dann", ar: "ثم / بعد ذلك"}
      - {vocab: "zuerst / danach", ar: "أولاً / بعد ذلك"}
      - {vocab: "schon", ar: "بالفعل / من قبل", ex: "Ich habe schon gegessen.", ex_ar: "أكلت بالفعل."}
      - {vocab: "noch", ar: "ما زال / أيضاً", ex: "Ich lerne noch.", ex_ar: "ما زلت أدرس."}
      - {vocab: "noch nicht", ar: "ليس بعد", ex: "Er ist noch nicht da.", ex_ar: "لم يصل بعد."}
      - {vocab: "wieder", ar: "مرة أخرى"}
      - {vocab: "auch", ar: "أيضاً", ex: "Ich komme auch.", ex_ar: "أنا آتٍ أيضاً."}
      - {vocab: "nur", ar: "فقط", ex: "Ich habe nur zehn Euro.", ex_ar: "معي عشرة يورو فقط."}
      - {vocab: "sehr", ar: "جداً"}
      - {vocab: "ganz", ar: "تماماً / كامل"}
      - {vocab: "fast", ar: "تقريباً", ex: "Es ist fast acht Uhr.", ex_ar: "الساعة تقريباً الثامنة."}
      - {vocab: "vielleicht", ar: "ربما", ex: "Vielleicht komme ich morgen.", ex_ar: "ربما آتي غداً."}
      - {vocab: "natürlich", ar: "طبعاً"}
      - {vocab: "leider", ar: "للأسف", ex: "Leider habe ich keine Zeit.", ex_ar: "للأسف ليس لدي وقت."}
      - {vocab: "hier / dort / da", ar: "هنا / هناك"}
      - {vocab: "oben / unten", ar: "فوق / تحت"}
      - {vocab: "draußen / drinnen", ar: "خارج / داخل"}
      - {vocab: "überall", ar: "في كل مكان"}
      - {vocab: "viel / viele", ar: "كثير", ex: "Ich habe viele Freunde.", ex_ar: "لدي أصدقاء كثيرون."}
      - {vocab: "wenig", ar: "قليل"}
      - {vocab: "alle / alles", ar: "الجميع / كل شيء", ex: "Alles ist gut.", ex_ar: "كل شيء بخير."}
      - {vocab: "etwas / nichts", ar: "شيء ما / لا شيء"}
      - {vocab: "jemand / niemand", ar: "أحد / لا أحد"}
      - {vocab: "jeder / jede / jedes", ar: "كل (واحد)", ex: "Ich lerne jeden Tag.", ex_ar: "أتعلم كل يوم."}
      - {vocab: "und / oder / aber", ar: "و / أو / لكن"}
      - {vocab: "denn", ar: "لأنّ (رابط)", ex: "Ich bleibe zu Hause, denn ich bin krank.", ex_ar: "أبقى في البيت لأنني مريض."}
      - {vocab: "zum Beispiel (z. B.)", ar: "على سبيل المثال"}
      - {vocab: "ungefähr", ar: "حوالي", ex: "Das kostet ungefähr 20 Euro.", ex_ar: "يكلف حوالي 20 يورو."}
      - gap: "Ich trinke ___ Kaffee, ich mag ihn nicht."
        options: [nie, immer, oft]
      - gap: "Hast du ___ gegessen? – Nein, noch nicht."
        options: [schon, noch, nie]
      - gap: "Ich habe ___ fünf Euro. Das reicht nicht."
        options: [nur, auch, viel]
      - gap: "___ habe ich keine Zeit. Tut mir leid."
        options: [Leider, Natürlich, Vielleicht]
      - gap: "Ich komme nicht, ___ ich muss arbeiten."
        options: [denn, oder, aber]
      - match: ["immer = دائماً", "manchmal = أحياناً", "nie = أبداً", "bald = قريباً", "leider = للأسف"]
      - order: "Ich gehe manchmal ins Kino."
        ar: أذهب أحياناً إلى السينما.
      - write: "Ich komme auch.|Ich komme auch"
        ar: "اكتب: أنا آتٍ أيضاً."

  - slug: a1-w-amt
    title_de: Ämter, Bank, Post und Kommunikation
    title_ar: الدوائر الرسمية، البنك، البريد، والتواصل
    goal_ar: أن تتعامل مع الدوائر والبنك والبريد والهاتف والإنترنت بمفردات A1.
    explanation_ar: |
      ## في الدائرة (das Amt)
      > Ich möchte mich anmelden. (أريد تسجيل السكن)
      > Ich brauche einen Termin. Füllen Sie bitte das Formular aus.
      ## في البنك
      > Ich möchte ein Konto eröffnen. — Geld abheben (سحب) / überweisen (تحويل)
      ## في البريد
      > Ich möchte ein Paket nach Syrien schicken. — Eine Briefmarke, bitte.
      ## الهاتف والإنترنت
      > Meine Handynummer ist… — Schreib mir eine E-Mail / eine Nachricht.
    items:
      - {vocab: "das Amt, ¨-er", ar: "الدائرة الرسمية", ex: "Ich muss zum Amt.", ex_ar: "يجب أن أذهب إلى الدائرة."}
