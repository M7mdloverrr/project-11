  - slug: a1-family
    title_de: Die Familie
    title_ar: العائلة
    goal_ar: أن تتكلم عن أفراد عائلتك وتستخدم mein/meine و dein/deine.
    explanation_ar: |
      ## أفراد العائلة
      | مذكر (der) | مؤنث (die) |
      |---|---|
      | der Vater (الأب) | die Mutter (الأم) |
      | der Sohn (الابن) | die Tochter (البنت) |
      | der Bruder (الأخ) | die Schwester (الأخت) |
      | der Großvater / Opa | die Großmutter / Oma |
      | der Mann (الزوج) | die Frau (الزوجة) |
      | der Onkel | die Tante |
      - الجمع: **die Eltern** (الوالدان)، **die Geschwister** (الإخوة)، **die Kinder** (الأولاد).
      ## mein / meine
      | مذكر/محايد | مؤنث وجمع |
      |---|---|
      | mein Vater, mein Kind | meine Mutter, meine Eltern |
      | dein Bruder | deine Schwester |
      > Das ist meine Schwester. Sie heißt Rana.
      > Hast du Geschwister? — Ja, ich habe zwei Brüder.
    items:
      - {vocab: "die Familie, -n", ar: "العائلة", ex: "Meine Familie ist groß.", ex_ar: "عائلتي كبيرة."}
      - {vocab: "die Mutter, ¨-", ar: "الأم", ex: "Meine Mutter heißt Samira.", ex_ar: "اسم أمي سميرة."}
      - {vocab: "der Vater, ¨-", ar: "الأب", ex: "Mein Vater arbeitet viel.", ex_ar: "أبي يعمل كثيراً."}
      - {vocab: "die Eltern (Pl.)", ar: "الوالدان", ex: "Meine Eltern wohnen in Jordanien.", ex_ar: "والداي يسكنان في الأردن."}
      - {vocab: "der Bruder, ¨-", ar: "الأخ", ex: "Ich habe einen Bruder.", ex_ar: "لدي أخ."}
      - {vocab: "die Schwester, -n", ar: "الأخت", ex: "Meine Schwester ist 12.", ex_ar: "أختي عمرها 12."}
      - {vocab: "die Geschwister (Pl.)", ar: "الإخوة والأخوات", ex: "Hast du Geschwister?", ex_ar: "هل لديك إخوة؟"}
      - {vocab: "der Sohn, ¨-e", ar: "الابن", ex: "Unser Sohn geht zur Schule.", ex_ar: "ابننا يذهب إلى المدرسة."}
      - {vocab: "die Tochter, ¨-", ar: "البنت (الابنة)", ex: "Meine Tochter ist drei.", ex_ar: "ابنتي عمرها ثلاث سنوات."}
      - {vocab: "das Kind, -er", ar: "الطفل", ex: "Wir haben zwei Kinder.", ex_ar: "لدينا طفلان."}
      - {vocab: "der Mann, ¨-er", ar: "الرجل / الزوج", ex: "Das ist mein Mann.", ex_ar: "هذا زوجي."}
      - {vocab: "die Großmutter, ¨- (Oma)", ar: "الجدة", ex: "Meine Oma ist 80.", ex_ar: "جدتي عمرها 80."}
      - {vocab: "der Großvater, ¨- (Opa)", ar: "الجد", ex: "Mein Opa erzählt Geschichten.", ex_ar: "جدي يحكي قصصاً."}
      - {vocab: "der Onkel, -", ar: "العم / الخال"}
      - {vocab: "die Tante, -n", ar: "العمة / الخالة"}
      - {vocab: "haben", ar: "يملك / لديه", ex: "Ich habe eine Schwester.", ex_ar: "لدي أخت."}
      - text: |
          Hallo! Ich heiße Omar und bin 28 Jahre alt. Ich komme aus Jordanien und wohne jetzt in Leipzig.
          Ich bin verheiratet. Meine Frau heißt Dana. Wir haben eine Tochter, sie ist zwei Jahre alt.
          Meine Eltern und meine Geschwister wohnen noch in Amman. Ich habe einen Bruder und zwei Schwestern.
        ar: |
          مرحباً! اسمي عمر وعمري 28 سنة. أنا من الأردن وأسكن الآن في لايبزيغ.
          أنا متزوج. اسم زوجتي دانة. لدينا بنت عمرها سنتان.
          والداي وإخوتي ما زالوا يسكنون في عمّان. لدي أخ واحد وأختان.
      - quiz: "حسب النص: كم أختاً لعمر؟"
        options: [اثنتان, واحدة, ثلاث, لا يوجد]
      - quiz: "حسب النص: أين يسكن والدا عمر؟"
        options: [في عمّان, في لايبزيغ, في برلين, في دمشق]
      - gap: "Das ist ___ Mutter."
        options: [meine, mein, meinen]
      - gap: "Das ist ___ Bruder."
        options: [mein, meine, meiner]
      - gap: "Wie heißt ___ Schwester?"
        options: [deine, dein, du]
      - gap: "Mein Vater und meine Mutter = meine ___."
        options: [Eltern, Geschwister, Kinder]
      - listen: "Ich habe zwei Kinder: einen Sohn und eine Tochter."
        ar: استمع — كم ولداً لديه؟
        options: [ولدان, ولد واحد, ثلاثة أولاد, لا أولاد]
      - match: ["die Mutter = الأم", "der Bruder = الأخ", "die Tochter = الابنة", "die Eltern = الوالدان", "die Oma = الجدة"]
      - order: "Hast du Geschwister?"
        ar: هل لديك إخوة؟
      - write: "Das ist meine Mutter.|Das ist meine Mutter"
        ar: "اكتب: هذه أمي."

