module:
  slug: a1-kontakte
  level: A1
  position: 1
  icon: hand
  title_de: Kontakte – Ich und die anderen
  title_ar: التعارف — أنا والآخرون
  description_ar: التحية والوداع، التعريف بالنفس، البلدان واللغات، الأرقام، البيانات الشخصية والعائلة — مواضيع امتحان Goethe A1 (Person, Familie).

lessons:
  - slug: a1-greetings
    title_de: Begrüßung und Abschied
    title_ar: التحية والوداع
    goal_ar: أن تحيّي الناس وتودّعهم بالشكل المناسب، رسمياً وغير رسمي، وتسأل عن الحال.
    explanation_ar: |
      ## التحية حسب الوقت
      | الوقت | التحية |
      |---|---|
      | الصباح حتى ~11 | Guten Morgen! |
      | النهار | Guten Tag! |
      | المساء | Guten Abend! |
      | قبل النوم | Gute Nacht! |
      | في أي وقت (غير رسمي) | Hallo! / Hi! |
      ## الوداع
      - رسمي: **Auf Wiedersehen!** — على الهاتف: **Auf Wiederhören!**
      - غير رسمي: **Tschüss!** / **Bis später!** / **Bis morgen!**
      ## Sie أم du؟
      - **Sie** (بحرف كبير) = حضرتك: للغرباء، في العمل، في الدوائر.
      - **du** = أنت: للأصدقاء، العائلة، الأطفال، والشباب فيما بينهم.
      > Wie geht es Ihnen? — Danke, gut. Und Ihnen?
      > Wie geht's? — Super! Und dir?
    items:
      - {phrase: "Guten Morgen!", ar: "صباح الخير!"}
      - {phrase: "Guten Tag!", ar: "نهارك سعيد! (تحية رسمية في النهار)"}
      - {phrase: "Guten Abend!", ar: "مساء الخير!"}
      - {phrase: "Gute Nacht!", ar: "تصبح على خير!"}
      - {phrase: "Hallo!", ar: "مرحباً!"}
      - {phrase: "Auf Wiedersehen!", ar: "إلى اللقاء! (رسمي)"}
      - {phrase: "Tschüss!", ar: "باي! (غير رسمي)"}
      - {phrase: "Bis morgen!", ar: "إلى الغد!"}
      - {phrase: "Wie geht es Ihnen?", ar: "كيف حالك؟ (رسمي)"}
      - {phrase: "Wie geht's?", ar: "كيف الحال؟ (غير رسمي)"}
      - {phrase: "Danke, gut. Und Ihnen?", ar: "بخير شكراً. وأنت؟ (رسمي)"}
      - {phrase: "Es geht.", ar: "ماشي الحال / لا بأس."}
      - {phrase: "Nicht so gut.", ar: "لستُ بخير كثيراً."}
      - {vocab: "danke", ar: "شكراً", ex: "Danke schön!", ex_ar: "شكراً جزيلاً!"}
      - {vocab: "bitte", ar: "من فضلك / تفضّل / عفواً", ex: "Danke! – Bitte!", ex_ar: "شكراً! — عفواً!"}
      - quiz: الساعة 8 صباحاً. ماذا تقول؟
        options: ["Guten Morgen!", "Guten Abend!", "Gute Nacht!", "Auf Wiederhören!"]
      - quiz: تودّع مديرك في العمل. ماذا تقول؟
        options: ["Auf Wiedersehen!", "Tschüss!", "Hallo!", "Gute Nacht!"]
      - quiz: تنهي مكالمة هاتفية رسمية. ماذا تقول؟
        options: ["Auf Wiederhören!", "Auf Wiedersehen!", "Guten Tag!", "Bis gleich!"]
      - quiz: مع من تستخدم Sie؟
        options: [مع موظف في الدائرة, مع أخيك, مع صديقك, مع طفل]
      - gap: "Wie geht es ___? – Danke, gut."
        ar: سؤال رسمي
        options: [Ihnen, dir, du, Sie]
      - gap: "Wie geht's? – Gut. Und ___?"
        ar: رد غير رسمي
        options: [dir, Ihnen, du, ich]
      - listen: "Guten Abend!"
        ar: استمع — متى تقال هذه التحية؟
        options: [في المساء, في الصباح, قبل النوم, عند الوداع]
      - listen: "Tschüss, bis morgen!"
        ar: استمع — ماذا يعني؟
        options: [باي، إلى الغد!, صباح الخير!, كيف حالك؟, شكراً جزيلاً]
      - match: ["Guten Morgen = صباح الخير", "Gute Nacht = تصبح على خير", "Tschüss = باي", "Danke = شكراً", "Bitte = من فضلك"]
      - order: "Wie geht es Ihnen?"
        ar: "رتّب: كيف حالك؟ (رسمي)"
      - write: "Guten Morgen|Guten Morgen!"
        ar: "اكتب: صباح الخير"

  - slug: a1-introduce
    title_de: Sich vorstellen
    title_ar: التعريف بالنفس
    goal_ar: أن تقول اسمك ومن أين أنت وأين تسكن، وتسأل الآخرين عن ذلك.
    explanation_ar: |
      ## أهم الأفعال الأولى
      | | heißen (يُسمّى) | kommen (يأتي) | wohnen (يسكن) | sein (يكون) |
      |---|---|---|---|---|
      | ich | heiße | komme | wohne | bin |
      | du | heißt | kommst | wohnst | bist |
      | er/sie | heißt | kommt | wohnt | ist |
      | Sie | heißen | kommen | wohnen | sind |
      ## الجمل
      > Ich heiße Karim. / Mein Name ist Karim.
      > Ich komme aus Syrien.
      > Ich wohne in Hamburg.
      > Ich bin 25 Jahre alt.
      ## الأسئلة
      | غير رسمي | رسمي |
      |---|---|
      | Wie heißt du? | Wie heißen Sie? |
      | Woher kommst du? | Woher kommen Sie? |
      | Wo wohnst du? | Wo wohnen Sie? |
      | Wie alt bist du? | Wie alt sind Sie? |
      - **aus** = من (البلد)، **in** = في (المدينة).
    items:
      - {phrase: "Ich heiße Karim.", ar: "اسمي كريم."}
      - {phrase: "Mein Name ist Lina Haddad.", ar: "اسمي لينا حداد."}
      - {phrase: "Ich komme aus Syrien.", ar: "أنا من سوريا."}
      - {phrase: "Ich wohne in Hamburg.", ar: "أسكن في هامبورغ."}
      - {phrase: "Ich bin 25 Jahre alt.", ar: "عمري 25 سنة."}
      - {phrase: "Wie heißen Sie?", ar: "ما اسمك؟ (رسمي)"}
      - {phrase: "Woher kommst du?", ar: "من أين أنت؟"}
      - {phrase: "Wo wohnen Sie?", ar: "أين تسكن؟ (رسمي)"}
      - {phrase: "Freut mich!", ar: "تشرّفت!"}
      - {vocab: "der Name, -n", ar: "الاسم", ex: "Wie ist Ihr Name?", ex_ar: "ما اسمك؟"}
      - {vocab: "der Vorname, -n", ar: "الاسم الأول", ex: "Mein Vorname ist Ali.", ex_ar: "اسمي الأول علي."}
      - {vocab: "der Familienname, -n", ar: "اسم العائلة", ex: "Mein Familienname ist Saleh.", ex_ar: "اسم عائلتي صالح."}
      - {vocab: "das Jahr, -e", ar: "السنة", ex: "Ich bin 30 Jahre alt.", ex_ar: "عمري 30 سنة."}
      - {vocab: "alt", ar: "كبير السن / قديم", ex: "Wie alt bist du?", ex_ar: "كم عمرك؟"}
      - gap: "Ich ___ Ahmed."
        options: [heiße, heißt, heißen]
      - gap: "Wie ___ du?"
        options: [heißt, heiße, heißen]
      - gap: "Woher ___ Sie?"
        options: [kommen, kommst, komme]
      - gap: "Ich komme ___ Ägypten."
        options: [aus, in, nach]
      - gap: "Ich wohne ___ Berlin."
        options: [in, aus, von]
      - gap: "Wie alt ___ du?"
        options: [bist, bin, ist, sind]
      - quiz: "كيف تسأل امرأة لا تعرفها عن اسمها؟"
        options: ["Wie heißen Sie?", "Wie heißt du?", "Wer bist du?", "Heißen Sie?"]
      - listen: "Ich komme aus dem Irak und wohne in Köln."
        ar: استمع — أين يسكن؟
        options: [في كولونيا, في العراق, في برلين, في ميونخ]
      - order: "Ich wohne in Hamburg."
        ar: أسكن في هامبورغ.
      - order: "Woher kommen Sie?"
        ar: من أين أنت؟ (رسمي)
      - write: "Ich komme aus Syrien.|Ich komme aus Syrien"
        ar: "اكتب: أنا من سوريا."
      - write: "Wie heißt du?"
        ar: "اكتب: ما اسمك؟ (غير رسمي)"

  - slug: a1-countries
    title_de: Länder und Sprachen
    title_ar: البلدان واللغات
    goal_ar: أن تذكر بلدك ولغتك وتسأل عن اللغات التي يتكلمها الآخرون.
    explanation_ar: |
      ## البلدان
      معظم أسماء البلدان بدون أداة: aus Deutschland, aus Syrien, aus Ägypten.
      بعض البلدان لها أداة:
      | البلد | من... |
      |---|---|
      | der Irak / der Libanon / der Sudan / der Jemen | aus dem Irak |
      | die Türkei / die Schweiz | aus der Türkei |
      | die USA (جمع) | aus den USA |
      ## اللغات
      اللغات غالباً تنتهي بـ -isch: Arabisch, Englisch, Französisch, Türkisch — لكن **Deutsch**.
      > Ich spreche Arabisch und ein bisschen Deutsch.
      > Welche Sprachen sprichst du?
      ## الفعل sprechen (غير منتظم)
      | ich spreche | du sprichst | er/sie spricht | wir/Sie sprechen |
      |---|---|---|---|
    items:
      - {vocab: "das Land, ¨-er", ar: "البلد", ex: "Aus welchem Land kommst du?", ex_ar: "من أي بلد أنت؟"}
      - {vocab: "die Sprache, -n", ar: "اللغة", ex: "Welche Sprachen sprechen Sie?", ex_ar: "ما اللغات التي تتكلمها؟"}
      - {vocab: "Deutschland", ar: "ألمانيا", ex: "Ich lebe in Deutschland.", ex_ar: "أعيش في ألمانيا."}
      - {vocab: "Österreich", ar: "النمسا", ex: "Wien ist in Österreich.", ex_ar: "فيينا في النمسا."}
      - {vocab: "die Schweiz", ar: "سويسرا", ex: "Er kommt aus der Schweiz.", ex_ar: "هو من سويسرا."}
      - {vocab: "die Türkei", ar: "تركيا", ex: "Sie kommt aus der Türkei.", ex_ar: "هي من تركيا."}
      - {vocab: "der Irak", ar: "العراق", ex: "Ich komme aus dem Irak.", ex_ar: "أنا من العراق."}
      - {vocab: "Arabisch", ar: "العربية", ex: "Ich spreche Arabisch.", ex_ar: "أتكلم العربية."}
      - {vocab: "Deutsch", ar: "الألمانية", ex: "Ich lerne Deutsch.", ex_ar: "أتعلم الألمانية."}
      - {vocab: "Englisch", ar: "الإنجليزية", ex: "Sprichst du Englisch?", ex_ar: "هل تتكلم الإنجليزية؟"}
      - {vocab: "sprechen", ar: "يتكلم", ex: "Er spricht gut Deutsch.", ex_ar: "يتكلم الألمانية جيداً."}
      - {vocab: "lernen", ar: "يتعلم", ex: "Wir lernen zusammen.", ex_ar: "نتعلم معاً."}
      - {vocab: "ein bisschen", ar: "قليلاً", ex: "Ich spreche ein bisschen Deutsch.", ex_ar: "أتكلم الألمانية قليلاً."}
      - gap: "Ich komme aus ___ Türkei."
        options: [der, dem, die]
      - gap: "Er kommt aus ___ Irak."
        options: [dem, der, die]
      - gap: "Ich komme aus ___."
        ar: أنا من ألمانيا.
        options: [Deutschland, Deutsch, deutsch]
      - gap: "Du ___ sehr gut Deutsch!"
        options: [sprichst, sprechst, spricht, sprechen]
      - gap: "Sie ___ Arabisch und Englisch."
        ar: هي تتكلم...
        options: [spricht, sprecht, sprichst, spreche]
      - quiz: "ما اللغة الرسمية في النمسا؟"
        options: [Deutsch, Österreichisch, Englisch, Französisch]
      - listen: "Ich spreche Arabisch, Englisch und ein bisschen Deutsch."
        ar: استمع — كيف لغته الألمانية؟
        options: [قليلة, ممتازة, لا يتكلمها, لغته الأم]
      - match: ["das Land = البلد", "die Sprache = اللغة", "lernen = يتعلم", "sprechen = يتكلم", "ein bisschen = قليلاً"]
      - order: "Welche Sprachen sprichst du?"
        ar: ما اللغات التي تتكلمها؟
      - write: "Ich spreche Arabisch.|Ich spreche Arabisch"
        ar: "اكتب: أتكلم العربية."

  - slug: a1-numbers-0-20
    title_de: Zahlen 0–20
    title_ar: الأرقام من 0 إلى 20
    goal_ar: أن تعدّ من 0 إلى 20 وتفهم الأرقام في الهاتف والعمر.
    explanation_ar: |
      ## من 0 إلى 12 — احفظها
      | 0 null | 1 eins | 2 zwei | 3 drei |
      |---|---|---|---|
      | 4 vier | 5 fünf | 6 sechs | 7 sieben |
      | 8 acht | 9 neun | 10 zehn | 11 elf |
      | 12 zwölf | | | |
      ## من 13 إلى 19 = الرقم + zehn
      > 13 dreizehn, 14 vierzehn, 15 fünfzehn
      انتبه: **16 sechzehn** (بدون s) و **17 siebzehn** (بدون en).
      ## 20 = zwanzig
      - على الهاتف يقول الألمان أحياناً **zwo** بدل zwei حتى لا تختلط بـ drei.
    items:
      - {vocab: "null", ar: "صفر"}
      - {vocab: "eins", ar: "واحد"}
      - {vocab: "zwei", ar: "اثنان"}
      - {vocab: "fünf", ar: "خمسة"}
      - {vocab: "neun", ar: "تسعة"}
      - {vocab: "zehn", ar: "عشرة"}
      - {vocab: "elf", ar: "أحد عشر"}
      - {vocab: "zwölf", ar: "اثنا عشر"}
      - {vocab: "sechzehn", ar: "ستة عشر"}
      - {vocab: "siebzehn", ar: "سبعة عشر"}
      - {vocab: "zwanzig", ar: "عشرون"}
      - {vocab: "die Zahl, -en", ar: "الرقم / العدد", ex: "Die Zahl ist richtig.", ex_ar: "الرقم صحيح."}
      - listen: "elf"
        ar: استمع — أي رقم؟
        options: ["11", "12", "8", "1"]
      - listen: "zwölf"
        ar: استمع — أي رقم؟
        options: ["12", "11", "20", "2"]
      - listen: "sechzehn"
        ar: استمع — أي رقم؟
        options: ["16", "6", "60", "17"]
      - listen: "neunzehn"
        ar: استمع — أي رقم؟
        options: ["19", "9", "90", "15"]
      - listen: "Meine Telefonnummer ist null, eins, fünf, sieben."
        ar: استمع — ما الرقم؟
        options: ["0157", "0175", "0517", "1057"]
      - quiz: "كيف تكتب 17؟"
        options: [siebzehn, siebenzehn, siebzig, sibzehn]
      - quiz: "كيف تكتب 16؟"
        options: [sechzehn, sechszehn, sechzig, sechs]
      - match: ["drei = 3", "acht = 8", "elf = 11", "fünfzehn = 15", "zwanzig = 20"]
      - write: "zwölf|zwoelf"
        ar: "اكتب الرقم 12 بالحروف:"
      - write: "fünfzehn|fuenfzehn"
        ar: "اكتب الرقم 15 بالحروف:"

  - slug: a1-numbers-100
    title_de: Zahlen bis 1000 und Preise
    title_ar: الأرقام حتى 1000 والأسعار
    goal_ar: أن تفهم الأرقام الكبيرة والأسعار وتسأل عن الثمن.
    explanation_ar: |
      ## العشرات
      | 20 zwanzig | 30 dreißig | 40 vierzig | 50 fünfzig |
      |---|---|---|---|
      | 60 sechzig | 70 siebzig | 80 achtzig | 90 neunzig |
      انتبه: **30 dreißig** بحرف ß، و 60 sechzig، 70 siebzig.
      ## الآحاد قبل العشرات! (مثل العربية)
      > 21 = einundzwanzig (واحد وعشرون)
      > 47 = siebenundvierzig
      ## المئات والآلاف
      > 100 (ein)hundert – 250 zweihundertfünfzig – 1000 (ein)tausend
      ## الأسعار
      > 3,50 € = drei Euro fünfzig
      > Was kostet das? / Wie viel kostet das? — Das kostet 12 Euro.
    items:
      - {vocab: "dreißig", ar: "ثلاثون"}
      - {vocab: "fünfzig", ar: "خمسون"}
      - {vocab: "siebzig", ar: "سبعون"}
      - {vocab: "hundert", ar: "مئة"}
      - {vocab: "tausend", ar: "ألف"}
      - {vocab: "der Euro, -s", ar: "اليورو", ex: "Das kostet zehn Euro.", ex_ar: "هذا يكلّف عشرة يورو."}
      - {vocab: "der Cent, -s", ar: "السنت", ex: "Das kostet 50 Cent.", ex_ar: "يكلّف 50 سنتاً."}
      - {vocab: "kosten", ar: "يكلّف", ex: "Was kostet die Tasche?", ex_ar: "كم ثمن الحقيبة؟"}
      - {vocab: "der Preis, -e", ar: "السعر", ex: "Der Preis ist gut.", ex_ar: "السعر جيد."}
      - {vocab: "teuer", ar: "غالٍ", ex: "Das ist zu teuer.", ex_ar: "هذا غالٍ جداً."}
      - {vocab: "billig", ar: "رخيص", ex: "Die Äpfel sind billig.", ex_ar: "التفاح رخيص."}
      - {phrase: "Wie viel kostet das?", ar: "كم ثمن هذا؟"}
      - listen: "einundzwanzig"
        ar: استمع — أي رقم؟
        options: ["21", "12", "20", "31"]
      - listen: "siebenundvierzig"
        ar: استمع — أي رقم؟
        options: ["47", "74", "17", "407"]
      - listen: "Das kostet drei Euro fünfzig."
        ar: استمع — كم السعر؟
        options: ["3,50 €", "5,30 €", "3,15 €", "13,50 €"]
      - listen: "Die Jacke kostet neunundachtzig Euro."
        ar: استمع — كم ثمن الجاكيت؟
        options: ["89 €", "98 €", "19 €", "80 €"]
      - quiz: "كيف تقول 65؟"
        options: [fünfundsechzig, sechsundfünfzig, sechzigfünf, fünfsechzig]
      - quiz: "كيف تكتب 30؟"
        options: [dreißig, dreizig, dreizehn, dreisig]
      - gap: "Was ___ der Kaffee?"
        options: [kostet, kosten, kostest]
      - match: ["dreißig = 30", "sechzig = 60", "siebzig = 70", "hundert = 100", "teuer = غالٍ"]
      - order: "Wie viel kostet das?"
        ar: كم ثمن هذا؟
      - write: "dreiundzwanzig"
        ar: "اكتب الرقم 23 بالحروف:"

  - slug: a1-personal-data
    title_de: Persönliche Angaben – ein Formular
    title_ar: البيانات الشخصية — تعبئة استمارة
    goal_ar: أن تفهم وتعبّئ استمارة (كما في امتحان Goethe A1 — الكتابة الجزء 1) وتتهجّى بياناتك.
    explanation_ar: |
      ## كلمات الاستمارة (Formular)
      | الألمانية | المعنى |
      |---|---|
      | Vorname / Nachname | الاسم الأول / اسم العائلة |
      | Geburtsdatum / Geburtsort | تاريخ / مكان الميلاد |
      | Straße, Hausnummer | الشارع، رقم البيت |
      | PLZ (Postleitzahl), Wohnort | الرمز البريدي، مكان السكن |
      | Telefonnummer / E-Mail | الهاتف / البريد |
      | Familienstand | الحالة الاجتماعية: ledig, verheiratet, geschieden |
      | Staatsangehörigkeit | الجنسية |
      | Beruf | المهنة |
      | Unterschrift | التوقيع |
      ## العنوان في ألمانيا
      > Goethestraße 12, 20095 Hamburg
      اسم الشارع ثم الرقم، ثم الرمز البريدي ثم المدينة.
      ## أسئلة مهمة
      > Wie ist Ihre Adresse? — Wie ist Ihre Telefonnummer?
      > Sind Sie verheiratet? — Nein, ich bin ledig.
    items:
      - {vocab: "das Formular, -e", ar: "الاستمارة", ex: "Füllen Sie bitte das Formular aus.", ex_ar: "املأ الاستمارة من فضلك."}
      - {vocab: "die Adresse, -n", ar: "العنوان", ex: "Wie ist Ihre Adresse?", ex_ar: "ما عنوانك؟"}
      - {vocab: "die Telefonnummer, -n", ar: "رقم الهاتف", ex: "Wie ist deine Telefonnummer?", ex_ar: "ما رقم هاتفك؟"}
      - {vocab: "die Postleitzahl, -en", ar: "الرمز البريدي", ex: "Die Postleitzahl ist 10115.", ex_ar: "الرمز البريدي 10115."}
      - {vocab: "das Geburtsdatum, -daten", ar: "تاريخ الميلاد", ex: "Mein Geburtsdatum ist der 3. Mai 1995.", ex_ar: "تاريخ ميلادي 3 أيار 1995."}
      - {vocab: "geboren", ar: "مولود", ex: "Ich bin in Aleppo geboren.", ex_ar: "وُلدت في حلب."}
      - {vocab: "ledig", ar: "أعزب", ex: "Ich bin ledig.", ex_ar: "أنا أعزب."}
      - {vocab: "verheiratet", ar: "متزوج", ex: "Sie ist verheiratet.", ex_ar: "هي متزوجة."}
      - {vocab: "geschieden", ar: "مطلّق", ex: "Er ist geschieden.", ex_ar: "هو مطلّق."}
