  - slug: alphabet-special-sounds
    title_de: s, z, w, v, j, -b/-d/-g, r
    title_ar: أصوات خاصة وتليين آخر الكلمة
    goal_ar: أن تتقن أصوات s و z و w و v و j وصوت r، وقاعدة آخر الكلمة.
    explanation_ar: |
      ## ملخص
      | الحرف | النطق | مثال |
      |---|---|---|
      | s قبل حرف علة | ز | Sonne, sieben |
      | s في آخر الكلمة | س | Haus, das |
      | z / tz | تس | Zimmer, Katze |
      | w | ڤ | Wohnung |
      | v | ف (غالباً) | viel, Vogel |
      | j | ي | Januar, jung |
      | r | راء من الحلق كالغين الخفيفة | rot, Brot |
      | -er في آخر الكلمة | تقريباً "آ" خفيفة | Vater, Lehrer |
      ## قاعدة آخر الكلمة (Auslautverhärtung)
      b و d و g في **آخر** الكلمة تصبح p و t و k:
      > Tag (تاك) – Kind (كِنت) – gelb (غِلب)
    items:
      - vocab: sieben
        ar: سبعة (s = ز)
        ex: Die Woche hat sieben Tage.
        ex_ar: الأسبوع فيه سبعة أيام.
      - vocab: das Zimmer, -
        ar: الغرفة (z = تس)
        ex: Das Zimmer ist hell.
        ex_ar: الغرفة مضيئة.
      - vocab: die Wohnung, -en
        ar: الشقة (w = ڤ)
        ex: Die Wohnung hat drei Zimmer.
        ex_ar: الشقة فيها ثلاث غرف.
      - vocab: viel
        ar: كثير (v = ف)
        ex: Vielen Dank!
        ex_ar: شكراً جزيلاً!
      - vocab: jung
        ar: شاب / صغير السن (j = ي)
        ex: Er ist jung.
        ex_ar: هو شاب.
      - vocab: der Tag, -e
        ar: اليوم/النهار (g في الآخر = ك)
        ex: Guten Tag!
        ex_ar: نهارك سعيد!
      - vocab: das Kind, -er
        ar: الطفل (d في الآخر = ت)
        ex: Das Kind spielt.
        ex_ar: الطفل يلعب.
      - vocab: der Vater, ¨-
        ar: الأب (-er = آ خفيفة)
        ex: Mein Vater ist Lehrer.
        ex_ar: أبي معلّم.
      - quiz: كيف تُنطق s في كلمة sieben؟
        options: [ز, س, ش, تس]
      - quiz: كيف تُنطق d في آخر كلمة Kind؟
        options: [ت, د, ذ, ض]
      - quiz: كيف تُنطق v في كلمة viel؟
        options: [ف, ڤ, و, ب]
      - listen: Zimmer
        ar: استمع — بأي صوت تبدأ الكلمة؟
        options: [تس, ز, س, ث]
      - listen: jung
        ar: استمع — أي كلمة سمعت؟
        options: [jung, Junge, Zunge]
      - match: ["sieben = سبعة", "das Zimmer = الغرفة", "die Wohnung = الشقة", "jung = شاب", "das Kind = الطفل"]
      - write: sieben
        ar: "اكتب الرقم 7 بالحروف:"

  - slug: alphabet-stress-melody
    title_de: Betonung und Satzmelodie
    title_ar: النبرة ولحن الجملة
    goal_ar: أن تعرف أين تقع النبرة في الكلمة وكيف يرتفع الصوت أو ينخفض في الأسئلة.
    explanation_ar: |
      ## النبرة في الكلمة
      - في الكلمات الألمانية الأصلية تقع النبرة غالباً على **المقطع الأول**: **Va**ter, **Mut**ter, **ar**beiten.
      - البادئات be-, ge-, ver- لا تحمل النبرة: be**su**chen, ver**ste**hen.
      - الأفعال المنفصلة تحمل النبرة على البادئة: **an**rufen, **ein**kaufen.
      - كلمات كثيرة مستعارة تُنبر في الآخر: Stu**dent**, Uni**ver**sität, Ca**fé**.
      ## لحن الجملة
      | نوع الجملة | الصوت في الآخر |
      |---|---|
      | جملة خبرية | ينخفض ↘ |
      | سؤال W (Wie, Wo...) | ينخفض ↘ |
      | سؤال نعم/لا | يرتفع ↗ |
      > Wo wohnst du? ↘
      > Wohnst du in Berlin? ↗
    items:
      - phrase: Wo wohnst du?
        ar: أين تسكن؟ (الصوت ينخفض في الآخر)
      - phrase: Wohnst du in Berlin?
        ar: هل تسكن في برلين؟ (الصوت يرتفع في الآخر)
      - phrase: Ich verstehe das nicht.
        ar: لا أفهم ذلك. (النبرة على -ste-)
      - phrase: Ich rufe dich an.
        ar: سأتصل بك. (النبرة على an)
      - quiz: أين النبرة في كلمة Vater؟
        options: [على Va, على ter, على الاثنين, لا يوجد نبرة]
      - quiz: أين النبرة في كلمة verstehen؟
        options: [على ste, على ver, على hen, في البداية دائماً]
      - quiz: في سؤال "Kommst du?" هل يرتفع الصوت في الآخر أم ينخفض؟
        options: [يرتفع, ينخفض]
      - quiz: في سؤال "Wie heißt du?" هل يرتفع الصوت في الآخر أم ينخفض؟
        options: [ينخفض, يرتفع]
      - listen: Wohnst du in Berlin?
        ar: استمع — ما نوع هذه الجملة؟
        options: [سؤال نعم/لا, سؤال بأداة استفهام, جملة خبرية]
      - listen: Ich wohne in Berlin.
        ar: استمع — ما نوع هذه الجملة؟
        options: [جملة خبرية, سؤال نعم/لا, أمر]
      - order: Wo wohnst du?
        ar: رتّب السؤال — أين تسكن؟
      - order: Ich verstehe das nicht.
        ar: رتّب الجملة — لا أفهم ذلك.

